


  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>云南大理-丽江5日深度游</title>
  <style>
    :root {
      --spacing-unit: 1rem;
      --primary-hue: 180;
      --primary-sat: 40%;
      --primary-light: 30%;
      --bg-color: #f9f7f0;
      --text-color: #2c2c2c;
      --card-bg: rgba(255, 255, 255, 0.7);
      --glass-border: rgba(255, 255, 255, 0.3);
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      --transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #12181b;
        --text-color: #e6e6e6;
        --card-bg: rgba(30, 30, 35, 0.7);
        --glass-border: rgba(255, 255, 255, 0.1);
        --shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      line-height: 1.8;
      letter-spacing: 0.02em;
      overflow-x: hidden;
    }

    h1, h2, h3, h4 {
      font-weight: 700;
      line-height: 1.2;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 0 1.5rem;
    }

    /* Hero Section */
    .hero {
      position: relative;
      height: 100vh;
      min-height: 600px;
      display: flex;
      align-items: flex-end;
      padding: 2rem 0 4rem;
      margin-bottom: 3rem;
      border-radius: 12px;
      overflow: hidden;
    }

    .hero::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.6), transparent 70%);
      border-radius: 12px;
      pointer-events: none;
    }

    .hero img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -1;
    }

    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 800px;
      padding: 0 1.5rem;
    }

    .hero h1 {
      font-size: clamp(2.5rem, 8vw, 4.5rem);
      color: white;
      margin-bottom: 1rem;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
      opacity: 0;
      animation: fadeInUp 1.2s ease-out 0.3s forwards;
    }

    .hero p {
      font-size: clamp(1.2rem, 4vw, 1.8rem);
      color: rgba(255, 255, 255, 0.9);
      opacity: 0;
      animation: fadeInUp 1.2s ease-out 0.6s forwards;
    }

    .scroll-indicator {
      position: absolute;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      width: 30px;
      height: 40px;
      border: 2px solid rgba(255, 255, 255, 0.7);
      border-radius: 20px;
      opacity: 0;
      animation: fadeIn 1s ease-out 1s forwards;
    }

    .scroll-indicator::before {
      content: '';
      position: absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 6px;
      height: 6px;
      background: rgba(255, 255, 255, 0.7);
      border-radius: 50%;
      animation: bounce 2s infinite;
    }

    /* Timeline */
    .timeline {
      position: relative;
      margin: 4rem 0;
    }

    .timeline::before {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      left: 1.5rem;
      width: 2px;
      background: hsl(var(--primary-hue), var(--primary-sat), var(--primary-light));
      opacity: 0.3;
    }

    .timeline-item {
      position: relative;
      margin-bottom: 3rem;
      padding-left: 3.5rem;
      opacity: 0;
    }

    .timeline-day {
      position: absolute;
      left: 0;
      top: 0;
      width: 3rem;
      height: 3rem;
      background: hsl(var(--primary-hue), var(--primary-sat), var(--primary-light));
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 1rem;
    }

    .timeline-content {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 1.5rem;
      box-shadow: var(--shadow);
      transition: var(--transition);
    }

    .timeline-content:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
    }

    .timeline-content:active {
      transform: scale(0.98);
    }

    .timeline-theme {
      font-size: 1.5rem;
      margin-bottom: 1rem;
      color: hsl(var(--primary-hue), var(--primary-sat), var(--primary-light));
    }

    .timeline-activities {
      margin: 1rem 0;
    }

    .timeline-activities li {
      margin-bottom: 0.5rem;
      padding-left: 1.2rem;
      position: relative;
    }

    .timeline-activities li::before {
      content: '•';
      position: absolute;
      left: 0;
      color: hsl(var(--primary-hue), var(--primary-sat), var(--primary-light));
      font-size: 1.2rem;
    }

    .timeline-tips {
      background: rgba(240, 248, 255, 0.6);
      border-left: 3px solid hsl(var(--primary-hue), var(--primary-sat), var(--primary-light));
      padding: 0.8rem 1rem;
      margin-top: 1rem;
      font-size: 0.95rem;
    }

    @media (prefers-color-scheme: dark) {
      .timeline-tips {
        background: rgba(30, 58, 90, 0.4);
      }
    }

    /* Budget Section */
    .budget-section {
      margin: 4rem 0;
    }

    .budget-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .budget-total {
      font-size: 2.5rem;
      font-weight: 800;
      background: linear-gradient(90deg, hsl(var(--primary-hue), var(--primary-sat), 40%), hsl(var(--primary-hue), var(--primary-sat), 60%));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 1rem 0;
    }

    .budget-chart {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1.5rem;
      margin-top: 2rem;
    }

    .budget-item {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 1.5rem;
      box-shadow: var(--shadow);
    }

    .budget-category {
      font-size: 1.1rem;
      margin-bottom: 0.5rem;
      color: hsl(var(--primary-hue), var(--primary-sat), var(--primary-light));
    }

    .budget-amount {
      font-size: 1.8rem;
      font-weight: 700;
    }

    .budget-bar {
      height: 8px;
      background: rgba(0, 0, 0, 0.05);
      border-radius: 4px;
      margin-top: 1rem;
      overflow: hidden;
    }

    @media (prefers-color-scheme: dark) {
      .budget-bar {
        background: rgba(255, 255, 255, 0.1);
      }
    }

    .budget-bar-fill {
      height: 100%;
      background: hsl(var(--primary-hue), var(--primary-sat), var(--primary-light));
      border-radius: 4px;
      width: 0;
      transition: width 1.5s ease-out;
    }

    /* Image Styles */
    .travel-image {
      width: 100%;
      height: auto;
      max-height: 60vh;
      object-fit: cover;
      border-radius: 12px;
      display: block;
      margin: 1.5rem 0 2rem;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
      border: 2px solid var(--glass-border);
    }

    .image-placeholder {
      width: 100%;
      height: 300px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: hsl(var(--primary-hue), var(--primary-sat), var(--primary-light));
      color: white;
      font-size: 1.2rem;
      text-align: center;
      margin: 1.5rem 0 2rem;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
    }

    /* Animations */
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% { transform: translateY(0) translateX(-50%); }
      40% { transform: translateY(-5px) translateX(-50%); }
      60% { transform: translateY(-3px) translateX(-50%); }
    }

    /* Responsive */
    @media (max-width: 768px) {
      .hero {
        min-height: 500px;
      }

      .timeline::before {
        left: 1rem;
      }

      .timeline-item {
        padding-left: 3rem;
      }

      .timeline-day {
        width: 2.5rem;
        height: 2.5rem;
        font-size: 0.9rem;
      }
    }
  </style>


  <div class="container">
    <!-- Hero Section -->
    <header class="hero">
      <img src="https://example.com/cover-image.jpg" alt="云南大理-丽江5日深度游封面">
      <div class="hero-content">
        <h1>云南大理-丽江5日深度游</h1>
        <p>苍山洱海 · 古城慢生活 · 玉龙雪山</p>
      </div>
      <div class="scroll-indicator"></div>
    </header>

    <!-- Timeline -->
    <section class="timeline" id="timeline">
      <article class="timeline-item" data-day="1">
        <div class="timeline-day">DAY 01</div>
        <div class="timeline-content">
          <h2 class="timeline-theme">抵达大理·洱海西岸骑行</h2>
          <img src="https://example.com/day1.jpg" alt="洱海西岸骑行" class="travel-image" onerror="this.outerHTML='<div>🌄 Day 1: 洱海西岸骑行</div>'">
          <ul class="timeline-activities">
            <li>下午：入住洱海民宿</li>
            <li>傍晚：环海西路骑行，打卡S弯</li>
          </ul>
          <div class="timeline-tips">洱海边风大，注意保暖</div>
        </div>
      </article>

      <article class="timeline-item" data-day="2">
        <div class="timeline-day">DAY 02</div>
        <div class="timeline-content">
          <h2 class="timeline-theme">苍山徒步 &amp; 大理古城夜游</h2>
          <img src="https://example.com/day2.jpg" alt="苍山徒步" class="travel-image" onerror="this.outerHTML='<div>🏔️ Day 2: 苍山徒步 &amp; 大理古城夜游</div>'">
          <ul class="timeline-activities">
            <li>上午：感通索道上苍山</li>
            <li>晚上：人民路逛手作店，听民谣</li>
          </ul>
          <div class="timeline-tips">苍山海拔较高，做好高原反应预防</div>
        </div>
      </article>
    </section>

    <!-- Budget Section -->
    <section class="budget-section">
      <div class="budget-header">
        <h2>预算概览</h2>
        <div class="budget-total" id="totalAmount">¥4,400</div>
      </div>
      <div class="budget-chart" id="budgetChart">
        <!-- Budget items will be inserted by JS -->
      </div>
    </section>
  </div>
