<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>云南大理-丽江5日深度游</title>
</head>
<body>
    <header>
        <h1>云南大理-丽江5日深度游</h1>
        <p class="subtitle">苍山洱海 · 古城慢生活 · 玉龙雪山</p>
        <img src="https://example.com/cover-image.jpg" alt="云南大理-丽江风景" class="cover">
    </header>
    
    <main>
        <section class="day">
            <h2>第1天：抵达大理·洱海西岸骑行</h2>
            <img src="https://example.com/day1.jpg" alt="洱海西岸骑行" class="day-image">
            <ul>
                <li>下午：入住洱海民宿</li>
                <li>傍晚：环海西路骑行，打卡S弯</li>
            </ul>
            <div class="tips">洱海边风大，注意保暖</div>
        </section>
        
        <section class="day">
            <h2>第2天：苍山徒步 & 大理古城夜游</h2>
            <img src="https://example.com/day2.jpg" alt="苍山徒步" class="day-image">
            <ul>
                <li>上午：感通索道上苍山</li>
                <li>晚上：人民路逛手作店，听民谣</li>
            </ul>
            <div class="tips">苍山海拔较高，做好高原反应预防</div>
        </section>
        
        <section class="budget">
            <h2>预算明细</h2>
            <ul>
                <li>住宿: 2000 CNY</li>
                <li>交通: 800 CNY</li>
                <li>餐饮: 1000 CNY</li>
                <li>门票: 400 CNY</li>
                <li>其他: 200 CNY</li>
            </ul>
        </section>
        
        <div class="weather-advice">
            <h3>天气建议</h3>
            <p>冬季出行，请关注当地天气预报，带好保暖衣物。</p>
        </div>
    </main>
</body>
</html>
