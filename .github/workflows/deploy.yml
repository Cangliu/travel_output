name: Deploy from AgentOne
on:
  repository_dispatch:
    types: [deploy-html]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - name: Write HTML and CSS to files
        run: |
          printf '%s' "${{ github.event.client_payload.html }}" > index.html
          if [ -n "${{ github.event.client_payload.css }}" ]; then
            printf '%s' "${{ github.event.client.payload.css }}" > style.css
          fi

      - name: Commit and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "AgentOne Bot"
          git config user.email "agentone@users.noreply.github.com"
          git add index.html style.css 2>/dev/null || true
          git commit -m "Deploy by AgentOne" || echo "No changes to commit."
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/Cangliu/travel_output.git
          git push
