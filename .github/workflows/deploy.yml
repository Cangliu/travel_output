name: Deploy from AgentOne
on:
  repository_dispatch:
    types: [deploy-html]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Write HTML to file
        run: |
          echo "${{ github.event.client_payload.html }}" > index.html

      - name: Force commit and push
        run: |
          git config user.name "AgentOne Bot"
          git config user.email "agentone@users.noreply.github.com"
          git add index.html
          git commit -m "Deploy by AgentOne" || echo "No changes to commit, but we're still pushing."
          git push --force-with-lease
